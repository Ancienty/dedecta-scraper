[project]
name = "scraper"
version = "0.1.0"
description = "HTTP microservice for scraping social media metrics"
requires-python = ">=3.13"
dependencies = [
    "scrapling[fetchers]>=0.4.3,<0.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
